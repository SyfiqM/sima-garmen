        - Sistem
      summary: Daftar notifikasi (paginasi)
      description: "**Hak akses:** semua."
      operationId: get_notifikasi
      x-roles: semua
      parameters:
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            example: 25
            minimum: 1
            maximum: 100
          description: Jumlah data per halaman (default 25).
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [created_at, -created_at, deadline, -deadline, tgl_order, -tgl_order, no_order, -no_order]
            default: -created_at
          description: Kolom pengurutan; awalan minus berarti descending.
      responses:
        "200":
          description: Daftar terpaginasi (format paginator Laravel).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paginated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /notifikasi/belum-dibaca:
