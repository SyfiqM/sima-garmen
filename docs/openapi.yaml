openapi: 3.1.0
info:
  title: SIMA Garmen API
  version: 1.1.0
  description: 'API backend SIMA Garmen, Batch 1B sampai Batch 8.


    **Format respons**

    - Objek tunggal: `{ "data": { ... } }`.

    - Daftar terpaginasi memakai paginator Laravel **datar**: `current_page`, `data`, `first_page_url`, `from`,
    `last_page`, `last_page_url`, `links`, `next_page_url`, `path`, `per_page`, `prev_page_url`, `to`, `total`.

    - Status (order, WO, koli, pengiriman, dan lain-lain) dikirim sebagai **string nilai**; ambil label tampilan
    dari `GET /enum`.

    - Error bisnis: `{ "message": "...", "code": "KODE" }`; validasi 422: `{ "message", "errors": { field: [..]
    } }`.

    - Unduhan PDF dan berkas memerlukan header Authorization, jadi unduh sebagai blob.
    - Update pada resource bahan, produk, pengguna, order, dan PO menerima PUT maupun PATCH.

    '
servers:
  - url: http://127.0.0.1:8000/api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth dan Profil
    description: Login, logout, profil, dan ganti password (Batch 1B).
  - name: Sistem
    description: Enum, menu, notifikasi, opsi dropdown, dan pengaturan umum (Batch 1B-2).
  - name: Master Data
    description: Master data, bahan, produk, dan BOM (Batch 2).
  - name: Pengguna dan Pengaturan
    description: Pengguna, pengaturan sistem, dan audit log (Batch 2).
  - name: Order
    description: Order, persetujuan, revisi, dan lampiran (Batch 3).
  - name: Work Order
    description: Daftar dan detail work order, tutup kurang, tahap produksi (Batch 3, 5, 6).
  - name: Stok dan Pembelian
    description: Stok, PO, penerimaan bahan, dan opname (Batch 4).
  - name: Pengeluaran Bahan dan Produksi
    description: Pengeluaran bahan dan input hasil tiga tahap (Batch 5).
  - name: QC, Repair, dan Packing
    description: Inspeksi QC, repair, dan koli (Batch 6).
  - name: Dashboard dan Laporan
    description: Dashboard per role dan 16 laporan (Batch 8).
  - name: Pengiriman
    description: Surat jalan dan konfirmasi penerimaan (Batch 7).
paths:
  /auth/login:
    post:
      tags:
        - Auth dan Profil
      summary: Login memakai username atau email
      description: "**Hak akses:** publik."
      operationId: post_auth_login
      x-roles: publik
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin12345
                device_name:
                  type: string
                  example: web
              required:
                - login
                - password
      responses:
        "200":
          description: "`data.token` dipakai sebagai Bearer token, `data.user` berisi profil."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Single"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /auth/logout:
    post:
      tags:
        - Auth dan Profil
      summary: Cabut token aktif
      description: "**Hak akses:** semua."
      operationId: post_auth_logout
      x-roles: semua
      responses:
        "204":
          description: Token dicabut.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me:
    get:
      tags:
        - Auth dan Profil
      summary: User aktif dan menu sesuai role
      description: "**Hak akses:** semua."
      operationId: get_me
      x-roles: semua
      responses:
        "200":
          description: Profil, role, tahap, dan daftar menu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Single"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/profil:
    put:
      tags:
        - Auth dan Profil
      summary: Ubah profil sendiri
      description: "**Hak akses:** semua."
      operationId: put_me_profil
      x-roles: semua
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Budi
                email:
                  type: string
                  example: budi@contoh.id
              required:
                - name
                - email
      responses:
        "200":
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Single"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /me/password:
    put:
      tags:
        - Auth dan Profil
      summary: Ganti password sendiri
      description: "**Hak akses:** semua."
      operationId: put_me_password
      x-roles: semua
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password_lama:
                  type: string
                  example: password123
                password_baru:
                  type: string
                  example: passwordBaru1
                  minLength: 8
                password_baru_confirmation:
                  type: string
                  example: passwordBaru1
              required:
                - password_lama
                - password_baru
                - password_baru_confirmation
      responses:
        "200":
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Single"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /enum:
    get:
      tags:
        - Sistem
      summary: Daftar enum (label tampilan status)
      description:
        'Status pada semua respons dikirim sebagai **string nilai** (mis. `"produksi"`). Ambil label
        tampilan dari endpoint ini: setiap enum berbentuk `[{value, label}]`. Kunci: roles, order_status, prioritas,
        jenis_bahan, tahap, work_order_status, work_order_tahap_status, purchase_order_status, pengeluaran_tipe,
        mutasi_tipe, dokumen_status, opname_status, packing_status, pengiriman_status, repair_status, tindakan_cacat.


        **Hak akses:** publik.'
      operationId: get_enum
      x-roles: publik
      security: []
      responses:
        "200":
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Single"
  /pengaturan-umum:
    get:
      tags:
        - Sistem
      summary: Pengaturan umum yang boleh dibaca publik
      description: "**Hak akses:** publik."
      operationId: get_pengaturan_umum
      x-roles: publik
      security: []
      responses:
        "200":
          description: Berhasil.
          content:
            application/json:
              schema:
