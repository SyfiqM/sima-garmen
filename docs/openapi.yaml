  /laporan/{jenis}:
    get:
      tags: [Dashboard dan Laporan]
      summary: Laporan (JSON, PDF, atau Excel)
      description: "Maks 30 permintaan per menit. kartu-stok wajib bahan_id. Hak akses per jenis: lihat CATATAN_API.md bagian 10."
      operationId: get_laporan_jenis
      parameters:
        - {
            in: path,
            name: jenis,
            required: true,
            schema:
              {
                type: string,
                enum:
                  [
                    order,
                    progres-wo,
                    produksi-harian,
                    wip,
                    reject,
                    repair,
                    stok-bahan,
                    kartu-stok,
                    kebutuhan-vs-stok,
                    pemakaian-bahan,
                    pembelian,
                    penerimaan,
                    pengiriman,
                    on-time-delivery,
                    opname,
                    audit-log,
                  ],
              },
          }
        - {
            in: query,
            name: format,
            schema: { type: string, enum: [json, pdf, xlsx], default: json },
          }
        - { in: query, name: tgl_dari, schema: { type: string, format: date } }
        - {
            in: query,
            name: tgl_sampai,
            schema: { type: string, format: date },
          }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: per_page, schema: { type: integer, maximum: 500 } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: bahan_id, schema: { type: integer } }
        - {
            in: query,
            name: kelompok,
            schema: { type: string, enum: [tahap, produk, line, jenis_cacat] },
          }
      responses:
        "200":
          description: JSON laporan, atau berkas PDF/XLSX (unduh sebagai blob).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Validasi gagal.
        "429":
          description: Terlalu banyak permintaan.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: Pesan untuk pengguna
        code:
          type: string
          example: KOLI_TIDAK_TERSEDIA
          enum:
            - STATUS_TIDAK_VALID
            - AKSI_TIDAK_VALID
            - TIDAK_ADA_HAK
            - VALIDASI_GAGAL
            - ALASAN_WAJIB
            - QTY_MELEBIHI_BATAS
            - STOK_TIDAK_CUKUP
            - STOK_DI_BAWAH_RESERVASI
            - BAHAN_TAHAP_BELUM_LENGKAP
            - TAHAP_SUDAH_DITUTUP
            - VOID_DITOLAK_HILIR_NEGATIF
            - BOM_BELUM_LENGKAP
            - MELEBIHI_TOLERANSI
            - DATA_SUDAH_DIPAKAI
            - KOLI_TIDAK_TERSEDIA
            - TIDAK_DITEMUKAN
          description: Kode aturan bisnis (hanya pada error bisnis).
        errors:
          type: object
          description: Hanya pada validasi 422 bawaan.
          additionalProperties:
            type: array
            items:
              type: string
    Single:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
    Paginated:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        first_page_url:
          type: string
        from:
          type:
            - integer
            - "null"
          example: 1
        last_page:
          type: integer
          example: 1
        last_page_url:
          type: string
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type:
                  - string
                  - "null"
              label:
                type: string
              active:
                type: boolean
        next_page_url:
          type:
            - string
            - "null"
        path:
          type: string
        per_page:
          type: integer
          example: 25
        prev_page_url:
          type:
            - string
            - "null"
        to:
          type:
            - integer
            - "null"
          example: 25
        total:
          type: integer
          example: 1
  responses:
    Unauthorized:
      description: Belum login atau token tidak valid (`{"message"}`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Role tidak berhak atau bukan pemilik data (`TIDAK_ADA_HAK` atau pesan umum).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Data tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Validasi gagal atau aturan bisnis dilanggar.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
