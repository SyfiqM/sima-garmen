          name: tgl_dari
          required: false
          schema:
            type: string
            format: date
            example: "2026-11-12"
        - in: query
          name: tgl_sampai
          required: false
          schema:
            type: string
            format: date
            example: "2026-11-12"
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            example: 25
            minimum: 1
            maximum: 100
          description: Jumlah data per halaman (default 25).
      responses:
        "200":
          description: Daftar terpaginasi (format paginator Laravel).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paginated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      tags:
        - QC, Repair, dan Packing
      summary: Catat inspeksi QC
      description:
        "Aturan: `qty_diperiksa = qty_lolos + qty_repair + qty_reject` dan `qty_diperiksa <= qc_tersedia`.
        Repair membuat antrean repair dan notifikasi ke supervisor tahap tujuan.


        **Hak akses:** admin, qc."
      operationId: post_qc_inspeksi
      x-roles: admin, qc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wo_id:
                  type: integer
                  example: 1
                tanggal:
                  type: string
                  format: date
                  example: "2026-11-12"
                catatan:
                  type: string
                  example: Catatan
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      wo_item_id:
                        type: integer
                        example: 1
                      qty_diperiksa:
                        type: integer
                        example: 100
                        minimum: 1
                      qty_lolos:
                        type: integer
                        example: 90
                        minimum: 0
                      qty_repair:
                        type: integer
                        example: 6
                        minimum: 0
                      qty_reject:
                        type: integer
                        example: 4
                        minimum: 0
                      tahap_tujuan_id:
                        type:
                          - integer
                          - "null"
                        example: 2
                        description: "Tahap repair: sewing atau finishing. Default sewing."
                      cacat:
                        type: array
                        items:
                          type: object
                          properties:
                            jenis_cacat_id:
                              type: integer
                              example: 1
                            qty:
                              type: integer
                              example: 6
                              minimum: 1
                            tindakan:
                              type: string
                              example: repair
                              enum:
                                - repair
                                - reject
                          required:
                            - jenis_cacat_id
                            - qty
                            - tindakan
                        description:
                          Total qty cacat bertindakan repair harus sama dengan qty_repair, dan reject
                          sama dengan qty_reject.
                    required:
                      - wo_item_id
                      - qty_diperiksa
                      - qty_lolos
                      - qty_repair
                      - qty_reject
                  minItems: 1
              required:
                - wo_id
                - tanggal
                - items
      responses:
        "201":
          description: Berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Single"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description:
            VALIDASI_GAGAL (rumus atau cacat tidak cocok), QTY_MELEBIHI_BATAS, STATUS_TIDAK_VALID (WO
            tidak aktif).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
