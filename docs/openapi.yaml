        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: integer
                  example: 1
                koli_ids:
                  type: array
                  items:
                    type: integer
                    example: 1
                  minItems: 1
                  description: ID koli berstatus tersedia milik order ini.
                tgl_kirim:
                  type:
                    - string
                    - "null"
                  format: date
                  example: "2026-11-12"
                ekspedisi:
                  type:
                    - string
                    - "null"
                  example: JNE
                no_resi:
                  type:
                    - string
                    - "null"
                  example: JNE123
                no_kendaraan:
                  type:
                    - string
                    - "null"
                  example: B 1234 CD
                nama_sopir:
                  type:
                    - string
                    - "null"
                  example: Andi
                nama_penerima:
                  type:
                    - string
                    - "null"
                  example: Budi
                alamat_tujuan:
                  type:
                    - string
                    - "null"
                  example: Jl. Tujuan No. 1
                  description: Default dari order.alamat_kirim.
                catatan:
                  type:
                    - string
                    - "null"
                  example: Catatan
              required:
                - order_id
                - koli_ids
      responses:
        "201":
          description: Berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Single"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: KOLI_TIDAK_TERSEDIA, VALIDASI_GAGAL (koli milik order lain), STATUS_TIDAK_VALID (status order).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
